# Version updates land on `deps`, never on main. Each pull request merges itself
# once CI is green on that exact commit; the collected result reaches main
# through one promotion pull request that a human merges.
#
# Monthly, one pull request per directory for every minor and patch bump, and
# one pull request per major. Minor and patch bumps rarely break anything, so
# grouping them costs little and cuts the noise to one pull request a month.
# Majors stay separate, so a major that breaks the build blocks only itself.
# Packages that must move together get their own group across all update types.
#
# 99 means "no limit". Everything lands on `deps`, and an update that fails CI
# stays an open pull request against that branch, where it blocks nothing.
#
# Dependabot security updates are switched off for this repository: they always
# target main and would bypass `deps`. security-audit.yml reports advisories
# instead — see docs/dependency-updates.md.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/dotnet-gidsik/1-Semester-2023/lab1"
      - "/dotnet-gidsik/1-Semester-2023/lab2"
      - "/dotnet-gidsik/1-Semester-2023/lab3"
      - "/dotnet-gidsik/1-Semester-2023/lab4"
      - "/dotnet-gidsik/1-Semester-2023/lab5"
      - "/dotnet-gidsik/1-Semester-2023/lab6"
      - "/dotnet-gidsik/2-Semester-2024/lab1"
      - "/dotnet-gidsik/2-Semester-2024/lab2"
      - "/dotnet-gidsik/2-Semester-2024/lab3"
      - "/dotnet-gidsik/2-Semester-2024/lab4"
      - "/dotnet-gidsik/2-Semester-2024/lab6"
      - "/dotnet-gidsik/2-Semester-2024/lab7"
      - "/dotnet-gidsik/2-Semester-2024/lab8"
      - "/musicstore-avalonia"
      - "/winforms-db-learning/survey-data-manager"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    open-pull-requests-limit: 99
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"

    # The EntityFrameworkCore packages have to move together. Nine projects here
    # pin EntityFrameworkCore alongside Sqlite, SqlServer or Design at the same
    # version, and those packages carry version ranges on each other: bumping one
    # alone leaves the rest below what it now demands and the restore breaks.
    # Ungrouped that is not one blocked update but a queue that cannot drain,
    # because every pull request in it fails the same way. Measured in
    # Marketplace-coursework-wpf-mvvm, which has the identical shape.
    #
    # minor-and-patch excludes the family's patterns. Without that, one scan
    # computes both groups against the same base: the family group raises a
    # package to its next major, minor-and-patch raises the same package to its
    # latest patch on the same line, and whichever merges second conflicts. That
    # happened here on 2026-09-25 (#54, #56).
    groups:
      microsoft-data-and-hosting:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
        update-types: ["minor", "patch"]

    # A target-framework fact, not caution. Every project holding EF Core here
    # targets net6.0 (most of them net6.0-windows) and pins 6.x. EF Core 7 still
    # ships net6.0 assets; EF Core 8 requires net8.0 and cannot restore on any of
    # them, however it is grouped. So 6 -> 7 stays available and 8 and above are
    # held back. Microsoft.Extensions is deliberately not capped: its 8.x and 9.x
    # releases still ship netstandard2.0 and restore fine on net6.0.
    #
    # Remove this when the projects are retargeted, not before.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">= 8.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    open-pull-requests-limit: 99
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(actions)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
