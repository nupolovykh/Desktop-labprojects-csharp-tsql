name: Security audit

# Deliberately NOT part of CI.
#
# `dotnet list package --vulnerable` reports on the global advisory database, not
# on the commit under test. A newly published advisory would turn every open pull
# request red at once — including the very bump that fixes it — and in a
# repository where green CI is what merges updates, that stops the updates from
# landing exactly when they matter most. Here it reports on a schedule and blocks
# nothing.
#
# It is also the one workflow that speaks about `main` itself: Dependabot's
# security updates are switched off in this repository, so this report is the
# only place the whole picture is written down. For NuGet it is also the only
# place transitive advisories show up at all — without a lock file the
# dependency graph lists direct packages only.
#
# The report is the run's summary and its warnings, not an issue. An issue stays
# open until every advisory is fixed, which for coursework may be never, and it
# is one more thing a human has to close. The summary is on the Actions tab of
# every run, and a finding never fails the run.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget:
    name: dotnet list package --vulnerable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Both lines are in use across the labs; restoring either one needs its own
      # SDK present.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      # The solutions are discovered rather than listed, so a lab added later is
      # audited without anybody remembering to edit this file.
      #
      # A restore that fails is reported and skipped rather than ending the run:
      # several of these target Windows and are built on a Windows runner in CI,
      # and a Linux restore of one of them failing says nothing about whether its
      # packages carry advisories. Blindness is still not allowed to be silent —
      # if nothing at all could be audited, the run says so in a warning and in
      # its summary.
      - name: Audit every solution
        run: |
          set -uo pipefail
          audited=0
          skipped=0
          vulnerable=0

          while IFS= read -r sln; do
            echo "::group::${sln}"
            if ! dotnet restore "$sln" >/dev/null 2>&1; then
              echo "::warning::restore failed, not audited: ${sln}"
              skipped=$((skipped + 1))
              echo "::endgroup::"
              continue
            fi
            report=$(dotnet list "$sln" package --vulnerable --include-transitive 2>&1)
            printf '%s\n' "$report"
            audited=$((audited + 1))
            if grep -q 'has the following vulnerable packages' <<<"$report"; then
              vulnerable=$((vulnerable + 1))
              echo "::warning::vulnerable packages referenced by ${sln}"
            fi
            echo "::endgroup::"
          done < <(find . -name '*.sln' -not -path './.git/*' | sort)

          summary="Audited ${audited} solution(s); ${skipped} could not be restored; ${vulnerable} carry advisories."
          echo "$summary"

          # A finding never fails the run: this workflow runs on a schedule
          # against the default branch, so a failure would pin a red check to
          # whatever commit that branch points at — permanently, since a check run
          # cannot be deleted and the mark outlives the fix.
          if [ "$audited" -eq 0 ]; then
            detail="No solution could be restored, so this run proves nothing about the packages."
            echo "::warning::${detail}"
          elif [ "$vulnerable" -gt 0 ]; then
            detail="${vulnerable} solution(s) reference packages with published advisories."
          else
            detail="Nothing vulnerable is referenced."
          fi

          {
            echo "### Security audit"
            echo
            echo "${detail}"
            echo
            echo "${summary}"
          } >>"$GITHUB_STEP_SUMMARY"
